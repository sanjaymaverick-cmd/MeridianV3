[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-v3"
version = "3.0.0"
description = "MERIDIAN V3 — personal auto-trading desk. V1+V2 complete, plus hybrid paper/live execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Meridian Desk" }]
license = { text = "Proprietary — personal use" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "yfinance>=0.2.50",
  "loguru>=0.7",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pillow>=10.4",
  "jugaad-data>=0.35",
  "ta>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "ruff>=0.8"]
desktop = ["pywebview>=5.3"]
ocr = ["pytesseract>=0.3.13"]

[project.scripts]
meridian-v3 = "meridian_v3.cli:main"
meridian_v3 = "meridian_v3.cli:main"

[tool.setuptools.packages.find]
include = ["meridian_v3*"]

[tool.setuptools.package-data]
meridian_v3 = [
  "ui/templates/**/*.html",
  "ui/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
